# ClassPilot Nginx 配置模板
# 部署路径：/etc/nginx/sites-available/classpilot

server {
    listen 443 ssl http2;
    server_name classpilot.example.com;

    # ssl_certificate /etc/letsencrypt/live/classpilot.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/classpilot.example.com/privkey.pem;

    root /opt/classpilot/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    client_max_body_size 12m;
}

server {
    listen 80;
    server_name classpilot.example.com;
    return 301 https://$host$request_uri;
}
