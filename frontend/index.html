<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=1200" />
    <title>ClassPilot 班级领航员</title>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="app-boot__spinner" aria-hidden="true"></div>
        <p class="app-boot__text">加载中…</p>
      </div>
    </div>
    <style>
      /* 首屏 CSS 占位，避免 JS/鉴权完成前白屏；色值与 tokens 对齐 */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f7ff;
      }
      .app-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 100vh;
        color: #64748b;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }
      .app-boot__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: app-boot-spin 0.7s linear infinite;
      }
      .app-boot__text {
        margin: 0;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
