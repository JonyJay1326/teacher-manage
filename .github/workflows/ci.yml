name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单测与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # nodejieba / better-sqlite3 为原生模块，Linux 上需源码编译
      - name: 安装原生模块编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: 安装后端依赖
        working-directory: backend
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 后端构建
        working-directory: backend
        run: npm run build

      - name: 后端单测
        working-directory: backend
        run: npm test

      - name: 前端类型检查（含 spec）
        working-directory: frontend
        run: npm run typecheck:test

      - name: 前端构建
        working-directory: frontend
        run: npm run build

      - name: 前端单测
        working-directory: frontend
        run: npm test

  e2e:
    name: E2E 关键路径
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # nodejieba / better-sqlite3 为原生模块，Linux 上需源码编译。
      # 应用启动即静态 import nodejieba（KnowledgeModule），装不上后端就起不来。
      - name: 安装原生模块编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: 安装后端依赖
        working-directory: backend
        run: npm ci

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # E2E 的 webServer 直接跑后端产物，必须先构建
      - name: 后端构建
        working-directory: backend
        run: npm run build

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: 上传失败留档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
